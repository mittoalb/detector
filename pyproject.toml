[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-detector"
version = "0.1.0"
description = "EPICS areaDetector for Hamamatsu ORCA Fire cameras with Euresys frame grabbers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "harvesters>=1.4.0",
    "caproto>=1.3.0",
    "numpy>=1.21.0",
    "imageio>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
viewer = [
    "pystream>=0.1.0",
]

[project.scripts]
orca-epics = "run_orca_epics:main"

[project.urls]
Homepage = "https://github.com/mittoalb/detector"
Repository = "https://github.com/mittoalb/detector"
Issues = "https://github.com/mittoalb/detector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["orca*"]

[tool.setuptools.package-data]
orca = ["*.py"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true