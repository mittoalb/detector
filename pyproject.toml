[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detectors"
version = "0.2.0"
description = "Camera-agnostic areaDetector EPICS IOC + Qt GUI for scientific cameras (Hamamatsu, Teledyne FLIR Oryx, Photometrics Kinetix)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "numpy>=1.21.0",
    "PyQt5>=5.15.0",
]

[project.optional-dependencies]
camera = [
    "harvesters>=1.4.0",
]
epics = [
    "caproto>=1.3.0",
    "h5py>=3.0.0",
    # cam_plugin subscribes to $(TS)HDF5Location via pyepics — in-process
    # caproto client wasn't reliable enough in the 32-ID environment.
    "pyepics>=3.5.0",
]
save = [
    "imageio>=2.19.0",
    "tifffile>=2023.1.0",
]

[project.urls]
Homepage = "https://github.com/mittoalb/detector"
Repository = "https://github.com/mittoalb/detector"
Issues = "https://github.com/mittoalb/detector/issues"

[project.scripts]
detectors-cli = "detectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["detectors*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true